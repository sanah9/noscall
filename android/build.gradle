
allprojects {
    repositories {
        google()
        mavenCentral()
        jcenter()
    }

    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile) {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    // Some plugins still declare their own legacy buildscript tool versions.
    // Keep every Android subproject on the versions selected by this app so a
    // plugin cannot downgrade AGP/Kotlin or pull a second compiler toolchain.
    buildscript {
        configurations.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'com.android.tools.build' &&
                        details.requested.name == 'gradle') {
                    details.useVersion '8.8.0'
                    details.because 'Use the Android Gradle Plugin selected by the app'
                }
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                        details.requested.name == 'kotlin-gradle-plugin') {
                    details.useVersion '2.1.0'
                    details.because 'Use the Kotlin Gradle Plugin selected by the app'
                }
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate {
        if (it.hasProperty('android')) {
            if (it.android.namespace == null) {
                def manifest = new XmlSlurper().parse(file(it.android.sourceSets.main.manifest.srcFile))
                def packageName = manifest.@package.text()
                android.namespace = packageName
            }
            def javaVersion = JavaVersion.VERSION_17
            android {
                def androidApiVersion = 35
                compileSdkVersion androidApiVersion
                defaultConfig {
                    targetSdkVersion androidApiVersion
                }
                compileOptions {
                    sourceCompatibility javaVersion
                    targetCompatibility javaVersion
                }
                tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                    kotlinOptions {
                        jvmTarget = javaVersion.toString()
                    }
                }
            }
        }
        configurations.all {
            resolutionStrategy {
                force "com.google.crypto.tink:tink:1.13.0"
                exclude group: "com.google.crypto.tink", module: "tink-android"
            }
        }

    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
