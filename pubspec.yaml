name: noscall
description: Flutter Voice Calling App.

version: 0.6.0+2009
publish_to: 'none'

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.10 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # third
  cupertino_icons: ^1.0.9
  uuid: ^4.3.3
  path_provider: ^2.1.5
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  connectivity_plus: ^7.3.0
  flutter_socks_proxy: ^0.0.3
  go_router: ^14.2.7
  flutter_easyloading: ^3.0.5
  shared_preferences: ^2.2.2
  unifiedpush: ^5.0.2
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.3.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.1
  package_info_plus: ^8.0.0
  image_picker: ^1.0.7
  mobile_scanner: ^7.1.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  http: ^1.1.0
  dio: ^5.4.0
  crypto: ^3.0.3
  convert: ^3.1.2
  mime: ^2.0.0
  bip340: ^0.3.0
  pointycastle: ^3.9.1
  record: ^5.1.0
  just_audio: ^0.9.40

  # calling
  callkeep:
    path: packages/callkeep
  flutter_webrtc: ^0.12.10

  # The hosted 1.0.1 release still depends on http 0.13.x. Keep the pinned git
  # revision until pub.dev publishes http 1.x-compatible Nostr APIs.
  nostr_core_dart:
    git:
      url: https://github.com/sanah9/nostr-dart
      ref: 71cc545e54565c2df6d8ab347cf54fcae646e770

  # Cashu protocol engine. Keep this pinned until upgrades pass the wallet
  # compatibility and mobile build test matrix.
  cdk:
    path: packages/cdk

dependency_overrides:
  # record 5.x resolves record_linux 0.7.x by default. Keep the newer Linux
  # backend pinned until the record 6/7 API migration is validated.
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  json_serializable: ^6.1.5
  
  # Testing tools
  mocktail: ^1.0.4                   # Mock library without code generation
  fake_async: ^1.3.1                 # Time control
  file: ^7.0.1
  connectivity_plus_platform_interface: ^2.0.1
  integration_test:                   # Integration testing
    sdk: flutter
#  flutter_socks_proxy: ^0.0.3

flutter:

  uses-material-design: true

  assets:
   - assets/images/
   - assets/sounds/classic/
